<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一人一世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .blog-container {
            width: 100%;
            height: 100%;
            /* 本地图片，直接写文件名 */
            background: url("images/bg.jpg") center/cover no-repeat;
            position: relative;
        }
        .top-nav {
            width: 100%;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
        }
        .logo {
            color: #fff;
            font-size: 18px;
            font-weight: 500;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
            opacity: 0.85;
            transition: 0.3s;
        }
        .nav-links a:hover {
            opacity: 1;
        }
        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
        }
        .avatar img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            margin-bottom: 16px;
            object-fit: cover;
        }
        .main-title {
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .sub-title {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .nav-btn {
            padding: 14px 32px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 999px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="blog-container">
        <div class="top-nav">
            <div class="logo">My Blog</div>
            <div class="nav-links">
                <a href="#">主页</a>
                <a href="#">文章</a>
                <a href="#">随笔</a>
               
            </div>
        </div>
        <div class="center-text">
          
               
         
            <div class="main-title">欢迎来到 寒焰尽 的博客</div>
            <div class="sub-title">记录学习，分享生活</div>
            <div class="btn-group">
                <a href="https://tsuiel.github.io/Javanotes" class="nav-btn">📝 JAVA笔记</a>
                <a href="https://tsuiel.github.io/travel" class="nav-btn">✈️ 旅行日记</a>
            </div>
        </div>
    </div>
</body>
</html>
